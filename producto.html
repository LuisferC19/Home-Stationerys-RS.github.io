<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalle del Producto - Home & Stationery</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#5d9b9b" />
</head>
<body>
    <header class="header">
        <div class="header-content">
             <a href="index.html" class="title-container" style="text-decoration: none; color: inherit;">
                <img src="img/thumb/HomeStatio.webp" alt="Logo de Home & Stationery" class="header-logo">
                <h1 class="header-title">Home & Stationery</h1>
            </a>
            <div class="header-right-controls">
                <div class="header-user">
                    <span id="nombreUsuario">Usuario</span>
                </div>
            </div>
        </div>
    </header>

    <main id="producto-detalle" class="main-content">
        <div class="producto-detalle-container">
            <div id="detalleSkeleton" class="producto-detalle-skeleton" aria-hidden="true">
                <div class="skeleton-box skeleton-img-grande"></div>
                <div class="producto-detalle-info-skeleton">
                    <div class="skeleton-box skeleton-titulo"></div>
                    <div class="skeleton-box skeleton-precio"></div>
                    <div class="skeleton-box skeleton-texto"></div>
                    <div class="skeleton-box skeleton-texto"></div>
                    <div class="skeleton-box skeleton-texto" style="width:60%"></div>
                </div>
            </div>
            <div id="detalleReal" class="producto-detalle-real oculto">
                <div class="producto-detalle-galeria">
                    <img src="" alt="Imagen principal del producto" id="imagen-principal">
                    <div id="galeria-thumbnails">
                        </div>
                </div>
                <div class="producto-detalle-info">
                    <h1 id="producto-nombre">Cargando producto...</h1>
                    <p class="precio" id="producto-precio"></p>
                    <p class="descripcion" id="producto-descripcion"></p>
                    <div class="agregar-controls">
                        <input type="number" id="cantidad-detalle" class="cantidad-input" value="1" min="1" aria-label="Cantidad">
                        <button id="btn-agregar-detalle" class="btn-agregar-carrito">Agregar al Carrito</button>
                    </div>
                </div>
                <div id="productos-relacionados" class="productos-relacionados">
                    <h2>Productos Relacionados</h2>
                    <div id="catalogo-relacionados" class="catalogo-reducido"></div>
                </div>
            </div>
        </div>
    </main>
    
    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <footer class="footer">
        <div class="footer-contact">
            <h3>Contacto Rápido</h3>
            <p>¿Dudas? ¡Escríbenos!</p>
            <a href="https://wa.me/522481602590" target="_blank" rel="noopener" class="btn-whatsapp-footer">💬 WhatsApp</a>
        </div>
        <div class="footer-map">
            <h3>Nuestra Ubicación</h3>
            <p>Tepetitla de Lardizábal, Tlaxcala, México.</p>
        </div>
    </footer>

    <script type="module" src="js/detalle-page.js"></script>
    <script src="sw-register.js"></script>
</body>
</html>
